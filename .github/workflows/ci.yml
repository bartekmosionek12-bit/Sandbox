name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: ruff check .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The only download of the runtime: at package build time, verified against the
      # sha256 pinned in packages/safeloadai-runtime (the build fails on a mismatch).
      - name: Cache WASI runtime
        uses: actions/cache@v4
        with:
          path: packages/safeloadai-runtime/src/safeloadai_runtime/python-3.12.0.wasm
          key: wasi-python-3.12.0-e5dc5a398b07b54ea8fdb503bf68fb583d533f10ec3f930963e02b9505f7a763
      - name: Fetch and verify the pinned runtime
        run: python packages/safeloadai-runtime/fetch_runtime.py
      - name: Build both packages
        run: |
          python -m pip install build
          python -m build packages/safeloadai-runtime --outdir dist
          python -m build . --outdir dist
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    env:
      SAFELOADAI_EXPECT_INSTALLED: "1"   # conftest refuses to test the source tree
      SAFELOADAI_REQUIRE_WASI: "1"       # a missing runtime is an error, not a skip
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install the built wheels into a clean venv
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$RUNNER_TEMP/venv/Scripts"; else BIN="$RUNNER_TEMP/venv/bin"; fi
          "$BIN/python" -m pip install --upgrade pip
          # The runtime from this build only, never from an index.
          "$BIN/python" -m pip install --no-index --find-links dist safeloadai-runtime==0.1.0
          WHEEL=$(ls dist/safeloadai-*-py3-none-any.whl)
          "$BIN/python" -m pip install "$WHEEL[test]"
          "$BIN/python" -m pip list
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      # From here on the test process has no network: the suite must pass offline.
      - name: Test offline (Linux, network namespace)
        if: runner.os == 'Linux'
        run: |
          sudo unshare --net -- bash -c 'ip link set lo up && exec sudo -u "$1" \
            --preserve-env=PATH,HOME,SAFELOADAI_EXPECT_INSTALLED,SAFELOADAI_REQUIRE_WASI,PYTHONIOENCODING \
            bash tools/ci_run_tests.sh "$2"' _ "$USER" "$BIN"
      - name: Test offline (macOS, sandbox-exec)
        if: runner.os == 'macOS'
        run: |
          sandbox-exec -p '(version 1)(allow default)(deny network-outbound (remote ip))' \
            bash tools/ci_run_tests.sh "$BIN"
      - name: Test offline (Windows, firewall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $venvPy = "$env:BIN\python.exe"
          $basePy = & $venvPy -c "import sys; print(sys._base_executable)"
          foreach ($exe in @($venvPy, $basePy)) {
            New-NetFirewallRule -DisplayName "safeloadai-offline $exe" -Direction Outbound -Program $exe -Action Block | Out-Null
          }
          & $venvPy tools/assert_offline.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $venvPy -m pytest -q -p no:cacheprovider
          exit $LASTEXITCODE
