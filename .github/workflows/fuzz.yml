# Weekly bounded fuzzing of safeloadai's own parsers (0.8.0): the pickle walker, the ZIP
# reader, the HDF5 metadata reader, joblib's array layout and the decompressors.
#
# fuzz/run.py runs atheris (coverage-guided) for a fixed time per target with the
# host-execution guard on. A crashing input is uploaded as an artifact; a maintainer
# commits it under fuzz/regressions/<target>/ with the fix, and tests/test_fuzz.py
# replays it on every CI run from then on. This workflow cannot write to the repository.
name: fuzz

on:
  schedule:
    - cron: "41 3 * * 3"   # Wednesdays 03:41 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: "seconds per target"
        default: "600"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [pickle, zipsafe, hdf5, joblib_layout, decompress]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install safeloadai and the fuzzers
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "lz4>=4.0,<5" "hypothesis==6.170.5" \
            "atheris==3.1.0" --only-binary atheris
      - name: Fuzz ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_PER_TARGET: ${{ inputs.seconds || '600' }}
        run: python fuzz/run.py "$TARGET" --seconds "$SECONDS_PER_TARGET"
      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-finding-${{ matrix.target }}
          path: fuzz/regressions/${{ matrix.target }}/
          if-no-files-found: ignore
