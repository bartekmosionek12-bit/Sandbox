# Publish safeloadai-runtime and safeloadai to PyPI with Trusted Publishing (OIDC, no API
# tokens). Runs only when started by hand from the Actions tab; it has never been run.
#
# One-time setup by the project owner, before the first run:
#   1. On pypi.org (and test.pypi.org for a dry run), add a "pending publisher" for BOTH
#      projects, safeloadai-runtime and safeloadai: owner bartekmosionek12-bit, repository
#      Sandbox, workflow publish.yml, environment "pypi" (or "testpypi").
#   2. In the repository settings, create the environments "pypi" and "testpypi"; adding
#      a required reviewer to "pypi" makes every real upload wait for approval.
#   docs/RELEASING.md has the full release procedure and the protection settings.
#
# Every upload carries PEP 740 attestations (Sigstore-signed provenance that ties each
# file to this workflow run); users verify them as docs/RELEASING.md describes.
#
# Order: the runtime first (safeloadai pins it exactly). An already published runtime
# version is skipped, so a safeloadai-only release re-uses safeloadai-runtime 0.1.0.
name: publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Index to upload to"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The only download of the runtime, verified against the pinned sha256.
      - name: Fetch and verify the pinned runtime
        run: python packages/safeloadai-runtime/fetch_runtime.py
      - name: Build both packages
        run: |
          python -m pip install build twine
          python -m build packages/safeloadai-runtime --outdir dist/runtime
          python -m build . --outdir dist/safeloadai
          python -m twine check --strict dist/runtime/* dist/safeloadai/*
          ls -l dist/*
      - name: Refuse a real upload from anywhere but main
        if: inputs.target == 'pypi' && github.ref != 'refs/heads/main'
        run: |
          echo "pypi uploads run only from main (this run is on ${GITHUB_REF})"; exit 1
      - name: Refuse development versions
        run: |
          if ls dist/*/* | grep -E '[0-9]\.?(dev|a|b|rc)[0-9]+'; then
            echo "a pre-release or development version would be published"; exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-runtime:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      id-token: write   # Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/runtime
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          skip-existing: true
          attestations: true

  publish-safeloadai:
    needs: publish-runtime
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/safeloadai
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          attestations: true
