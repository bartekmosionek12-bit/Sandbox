# Weekly check for a newer upstream WASI CPython build (VMware Wasm Labs
# webassembly-language-runtimes) or a wasmtime major outside the pyproject.toml
# requirement. When one exists, one issue is opened, or updated if it is already open.
#
# Detect only: nothing is downloaded or installed and no pin is changed. Updating the
# runtime is the manual procedure in docs/UPDATING_RUNTIME.md (new pinned sha256,
# rebuilt safeloadai-runtime, full test suite and evaluation, new version).
name: runtime-watch

on:
  schedule:
    - cron: "41 5 * * 1"   # Mondays 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write   # the runtime issue, nothing else
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Compare the pins with upstream releases
        id: watch
        env:
          GITHUB_TOKEN: ${{ github.token }}   # read-only use: release metadata rate limit
        run: python tools/runtime_watch.py --out "$RUNNER_TEMP/runtime.md" --github-output "$GITHUB_OUTPUT"
      - name: Open or update the runtime issue
        if: steps.watch.outputs.newer == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          REPORT: ${{ runner.temp }}/runtime.md
        with:
          script: |
            const fs = require("fs");
            const title = "Runtime watch: newer WASI CPython or wasmtime release";
            const body = fs.readFileSync(process.env.REPORT, "utf8").slice(0, 60000);
            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "open", per_page: 100 });
            const existing = open.find((i) => !i.pull_request && i.title === title);
            if (existing) {
              if (existing.body !== body) {
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              }
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
