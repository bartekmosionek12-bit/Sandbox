[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safeloadai"
version = "0.2.0"
authors = [
  { name="Bartosz Mosionek" },
]
description = "SafeLoadAI — warstwy detekcji RCE w plikach modeli ML (.pkl, .keras)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.125,<1.0"
]

[project.optional-dependencies]
# Dashboard (app/) to widok dowodowy, nie część biblioteki — Flask nie jest
# potrzebny, żeby wpiąć safe_load_model w swój kod albo w CI.
dashboard = [
    "Flask>=3.0,<4.0",
]
dev = [
    "pytest",
]

[project.scripts]
safeloadai = "sandbox_rce.__main__:main"

[project.urls]
"Homepage" = "https://github.com/bartekmosionek12-bit/Sandbox"

[tool.setuptools.packages.find]
include = ["sandbox_rce*"]

