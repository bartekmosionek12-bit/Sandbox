name: safeloadai model scan
description: >-
  Scan model files (pickle, joblib, PyTorch, Keras, HDF5) without loading them, and
  report the result to GitHub code scanning as SARIF.
author: safeloadai
branding:
  icon: shield
  color: red

inputs:
  path:
    description: Files or directories to scan, separated by spaces (relative to the workspace).
    required: false
    default: "."
  fail-on:
    description: >-
      "suspicious" (default): fail on MALICIOUS, SUSPICIOUS, UNSUPPORTED and on any ERROR.
      "malicious": fail on MALICIOUS and on any ERROR only (a file safeloadai could not
      scan always fails the job).
    required: false
    default: suspicious
  sarif-file:
    description: Where to write the SARIF log.
    required: false
    default: safeloadai.sarif
  upload-sarif:
    description: >-
      Upload the SARIF log to GitHub code scanning ("true" or "false"). Needs the
      "security-events: write" permission.
    required: false
    default: "true"
  version:
    description: >-
      safeloadai version to install from PyPI (for example "0.8.0"). Empty (default):
      install the safeloadai source of this action's own ref.
    required: false
    default: ""
  python-version:
    description: Python used to run safeloadai.
    required: false
    default: "3.12"
  args:
    description: >-
      Extra arguments for "safeloadai scan" (for example "--deep" or "--config safeloadai.toml").
      Every non-default option is announced in the log and recorded in the report.
    required: false
    default: ""

outputs:
  exit-code:
    description: The exit code of "safeloadai scan" (docs/ERRORS.md).
    value: ${{ steps.scan.outputs.exit-code }}
  sarif-file:
    description: Path of the SARIF log.
    value: ${{ inputs.sarif-file }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install safeloadai
      shell: bash
      env:
        SAFELOADAI_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m venv "$RUNNER_TEMP/safeloadai-venv"
        if [ -n "$SAFELOADAI_VERSION" ]; then
          "$RUNNER_TEMP/safeloadai-venv/bin/pip" install --quiet "safeloadai==$SAFELOADAI_VERSION"
        else
          "$RUNNER_TEMP/safeloadai-venv/bin/pip" install --quiet "$ACTION_PATH"
        fi
        "$RUNNER_TEMP/safeloadai-venv/bin/safeloadai" doctor

    - name: Scan
      id: scan
      shell: bash
      env:
        SCAN_PATHS: ${{ inputs.path }}
        SCAN_ARGS: ${{ inputs.args }}
        SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        set +e
        # word splitting is intended: several paths and extra arguments
        # shellcheck disable=SC2086
        "$RUNNER_TEMP/safeloadai-venv/bin/safeloadai" scan $SCAN_PATHS --no-input --sarif "$SARIF_FILE" $SCAN_ARGS
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "safeloadai scan exited $code"

    - name: Upload SARIF
      if: always() && inputs.upload-sarif == 'true' && hashFiles(inputs.sarif-file) != ''
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: safeloadai

    - name: Verdict
      shell: bash
      env:
        CODE: ${{ steps.scan.outputs.exit-code }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        # 0 CLEAN, 1 MALICIOUS, 2 usage, 3 SUSPICIOUS, 4/6 ERROR, 5 UNSUPPORTED (docs/ERRORS.md)
        case "$FAIL_ON" in
          suspicious) [ "$CODE" = "0" ] && exit 0 ;;
          malicious) case "$CODE" in 0|3|5) exit 0 ;; esac ;;
          *) echo "::error::fail-on must be 'suspicious' or 'malicious', not '$FAIL_ON'"; exit 2 ;;
        esac
        echo "::error::safeloadai scan exited $CODE (1 MALICIOUS, 2 usage error, 3 SUSPICIOUS, 4/6 ERROR, 5 UNSUPPORTED)"
        exit 1
