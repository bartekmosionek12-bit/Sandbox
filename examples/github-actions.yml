# Example: scan model files in a pull request with safeloadai.
# Copy to .github/workflows/ in the repository that holds the models.
name: model-scan

on:
  pull_request:
    paths: ["models/**"]

permissions:
  contents: read

jobs:
  safeloadai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The runtime comes with the pinned safeloadai-runtime package: nothing to fetch.
      - name: Install safeloadai
        run: pip install "safeloadai==0.3.0"
      - name: Check the sandbox
        run: safeloadai doctor
      - name: Scan
        # Exit 1 = MALICIOUS, 3 = SUSPICIOUS; both fail the job.
        run: safeloadai scan models/ --report safeloadai-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safeloadai-report
          path: safeloadai-report.json
