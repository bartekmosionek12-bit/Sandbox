[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safeloadai"
version = "0.5.0"
authors = [
  { name="Bartosz Mosionek" },
]
description = "SafeLoadAI: decide whether an ML model file is safe to load (static analysis + sandboxed emulation)."
readme = "README.md"
requires-python = ">=3.11"
# The sandbox boundary is only as good as its runtime: the CPython-on-WASI build is
# pinned exactly (and its sha256 is checked again at run time), wasmtime to the
# major version the test suite runs against.
dependencies = [
    "safeloadai-runtime==0.1.0",
    "wasmtime>=49.0.0,<50",
]

[project.optional-dependencies]
# lz4-compressed joblib files can only be analysed with the lz4 codec installed;
# without it they are SUSPICIOUS (never skipped).
lz4 = [
    "lz4>=4.0,<5",
]
# The LLM judge is optional and off by default; the library works without it.
judge = [
    "anthropic>=0.125,<1.0",
]
# The dashboard (app/) is a report viewer, not part of the library.
dashboard = [
    "Flask>=3.0,<4.0",
]
# What the test suite needs on top of the library (CI installs the wheel with it).
test = [
    "pytest",
    "Flask>=3.0,<4.0",
    # fixture writers only: files are created with them, never loaded with them
    "numpy",
    "joblib",
    "scikit-learn",
    "lz4>=4.0,<5",
]
dev = [
    "safeloadai[test]",
    "ruff",
    "build",
]

[project.scripts]
safeloadai = "safeloadai.__main__:main"

[project.urls]
"Homepage" = "https://github.com/bartekmosionek12-bit/Sandbox"

[tool.setuptools.packages.find]
where = ["src"]
include = ["safeloadai*"]

[tool.setuptools.package-data]
"safeloadai.sandbox" = ["guest/*.py"]
"safeloadai.static.upstream" = ["*.json"]
"safeloadai.data" = ["*.tsv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Only the repo root (for tests.*, tools.*): safeloadai itself must come from an
# installed package (editable for development, the built wheel in CI).
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["audit", "packages/safeloadai-runtime/build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Guest code runs inside the sandbox and keeps a plain, version-neutral style.
"src/safeloadai/sandbox/guest/*.py" = ["UP031"]
"src/safeloadai/shared/*.py" = ["UP031"]
