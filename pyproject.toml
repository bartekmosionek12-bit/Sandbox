[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safeloadai"
version = "0.3.0.dev0"
authors = [
  { name="Bartosz Mosionek" },
]
description = "SafeLoadAI: decide whether an ML model file is safe to load (static analysis + sandboxed emulation)."
readme = "README.md"
requires-python = ">=3.11"
# wasmtime is pinned exactly: the sandbox boundary is only as good as the runtime.
dependencies = [
    "wasmtime==49.0.0",
]

[project.optional-dependencies]
# The LLM judge is optional and off by default; the library works without it.
judge = [
    "anthropic>=0.125,<1.0",
]
# The dashboard (app/) is a report viewer, not part of the library.
dashboard = [
    "Flask>=3.0,<4.0",
]
dev = [
    "pytest",
    "ruff",
    "Flask>=3.0,<4.0",
]

[project.scripts]
safeloadai = "safeloadai.__main__:main"

[project.urls]
"Homepage" = "https://github.com/bartekmosionek12-bit/Sandbox"

[tool.setuptools.packages.find]
where = ["src"]
include = ["safeloadai*"]

[tool.setuptools.package-data]
"safeloadai.sandbox" = ["guest/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["audit", "poc/samples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Guest code runs inside the sandbox and keeps a plain, version-neutral style.
"src/safeloadai/sandbox/guest/*.py" = ["UP031"]
